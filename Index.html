<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Website</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:linear-gradient(135deg,#4f46e5,#06b6d4);
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
    }

    .card{
      background:rgba(255,255,255,0.12);
      padding:40px;
      border-radius:20px;
      backdrop-filter:blur(10px);
      box-shadow:0 10px 30px rgba(0,0,0,.3);
      max-width:600px;
    }

    h1{
      font-size:3rem;
      margin-bottom:15px;
    }

    p{
      font-size:1.1rem;
      margin-bottom:25px;
      opacity:.9;
    }

    button{
      padding:12px 28px;
      border:none;
      border-radius:30px;
      background:white;
      color:#4f46e5;
      font-size:1rem;
      cursor:pointer;
      transition:.3s;
    }

    button:hover{
      transform:scale(1.05);
    }
  </style>
</head>
<body>

<div class="card">
  <h1>🚀 Hello World!</h1>
  <p>Your website has been deployed successfully.</p>

  <button onclick="showMessage()">Click Me</button>
</div>

<script>
function showMessage(){
    alert("🎉 Congratulations! Your deployment works perfectly.");
}
</script>
<script>
(function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="gAs-De0I2lwC8xRTnyCcS";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
</script>
</body>
</html>
